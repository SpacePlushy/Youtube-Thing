name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          
          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"
          
          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"
          
          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"
          
          # Allow Claude to run specific commands for testing and validation
          allowed_tools: |
            Bash(npm run build)
            Bash(npm run test)
            Bash(npm run lint)
            Bash(npm run typecheck)
            Bash(npx tsc --noEmit)
            Bash(npm run dev)
            Edit
            MultiEdit
            Write
            Read
            Grep
            LS
          
          # Custom instructions for YouTube Thing project
          custom_instructions: |
            You are working on YouTube Thing, a Next.js 15 app for extracting and formatting YouTube transcripts.
            
            **Tech Stack:**
            - Next.js 15 with App Router
            - TypeScript with strict mode
            - Tailwind CSS for styling
            - Cerebras AI for ultra-fast formatting (2,600+ tokens/sec)
            - Oxylabs for transcript extraction
            - Upstash Redis for rate limiting (1 request per 10 seconds)
            
            **Key Guidelines:**
            - Always preserve TypeScript types - avoid 'any'
            - Keep API keys server-side only (never expose to client)
            - Follow Next.js App Router patterns
            - Use streaming responses for long operations
            - Implement proper error handling with user-friendly messages
            - Hide proprietary service names in error messages
            - Consider rate limiting in all API interactions
            - Support transcripts for videos up to 3+ hours
            - Use the Text tool for file operations, not Bash cat/head/tail
            
            **Project Structure:**
            - /app/api/* - API routes (server-side only)
            - /components/* - React components
            - /lib/* - Utility functions and constants
            - Environment variables are in lib/env-config.ts
          
          # Environment variables for Claude
          claude_env: |
            NODE_ENV: development
            NEXT_PUBLIC_APP_URL: https://www.youtubething.com

