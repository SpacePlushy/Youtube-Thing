name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'
    
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          # model: "claude-opus-4-20250514"
          
          # Direct prompt for automated review (no @claude mention needed)
          direct_prompt: |
            Please review this pull request for a YouTube transcript extraction app and provide feedback on:
            
            **Security Focus:**
            - Check for exposed API keys or credentials (especially CEREBRAS_API_KEY, OXYLABS credentials)
            - Verify environment variables are not exposed to client-side
            - Look for potential data leaks in error messages
            - Check for proper input validation on YouTube URLs
            
            **Performance Considerations:**
            - Look for inefficient transcript processing (we handle videos up to 3+ hours)
            - Check if streaming responses are implemented correctly
            - Verify proper chunking for large transcripts
            - Ensure rate limiting is respected (1 request per 10 seconds)
            
            **Error Handling:**
            - Ensure user-friendly error messages that don't expose internal service names
            - Check for proper fallback mechanisms
            - Verify all API errors are caught and handled gracefully
            
            **TypeScript & Code Quality:**
            - Verify proper types for transcript data structures
            - Check for any 'any' types that should be properly typed
            - Ensure interfaces are defined for all data shapes
            - Look for unused imports or dead code
            
            **Next.js 15 Best Practices:**
            - Verify App Router patterns are followed
            - Check that API routes use proper streaming where applicable
            - Ensure server components vs client components are used appropriately
            
            Be constructive and specific in your feedback. Suggest code improvements where applicable.

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          # use_sticky_comment: true
          
          # Optional: Customize review based on file types
          # direct_prompt: |
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality
          
          # Optional: Different prompts for different authors
          # direct_prompt: |
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' && 
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}
          
          # Optional: Add specific tools for running tests or linting
          # allowed_tools: "Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck)"
          
          # Optional: Skip review for certain conditions
          # if: |
          #   !contains(github.event.pull_request.title, '[skip-review]') &&
          #   !contains(github.event.pull_request.title, '[WIP]')

